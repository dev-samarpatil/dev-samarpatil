<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1018"><title>Playable Signal — Samarjeet Patil</title>
<style>
:root{color-scheme:dark;--line:#263744;--text:#e6f1f5;--muted:#8ea3b2;--green:#34d399}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#183244 0,#0b1018 55%);font-family:ui-monospace,Consolas,monospace;color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}
main{width:min(920px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}h1{font:700 clamp(22px,4vw,34px) system-ui;margin:0}header p{margin:5px 0 0;color:var(--muted);font-size:13px}.pill{border:1px solid #276448;color:#73efb7;padding:7px 11px;border-radius:999px;font-size:11px;letter-spacing:.12em}
.screen{background:#080d13;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 18px 65px #0008}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#080d13;border-radius:10px;touch-action:none}
.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 8px 4px;font-size:13px;color:var(--muted)}.hud strong{color:var(--green)}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}button{background:#172632;color:var(--text);border:1px solid #355061;border-radius:10px;padding:12px 17px;font:600 13px ui-monospace,monospace;cursor:pointer;min-height:44px;touch-action:manipulation}button.primary{background:#166a47;border-color:#269b68;color:#effff7}button:focus-visible{outline:3px solid #60a5fa;outline-offset:3px}.pad{display:flex;gap:8px}.help{color:var(--muted);font-size:12px;line-height:1.7;margin:13px 3px 0}
@media(max-width:520px){body{padding:12px}.controls{justify-content:center}.pad{width:100%;justify-content:center}.controls>button{flex:1}}
</style></head><body><main>
<header><div><h1>🕹️ Playable Signal</h1><p>CONTRIBUTION ARCADE / PILOT: SAMARJEET</p></div><span class="pill">● SYSTEM ONLINE</span></header>
<section class="screen" aria-label="Arcade game"><canvas id="game" width="960" height="540" aria-label="Space shooter game area"></canvas>
<div class="hud"><span>SCORE: <strong id="score">0</strong></span><span>BEST: <strong id="best">0</strong></span><span>SHIELDS: <strong id="lives">3</strong></span><span id="status" aria-live="polite">READY</span></div></section>
<div class="controls"><button class="primary" id="start">▶ START / RESTART</button><div class="pad"><button id="left">◀ LEFT</button><button id="shoot">✦ FIRE</button><button id="right">RIGHT ▶</button></div><button id="pause">Ⅱ PAUSE</button></div>
<p class="help">KEYBOARD: ← / → or A / D to move · SPACE to fire · P to pause. On touch screens, use the buttons. Dodge the falling signal blocks and shoot to clear the wave.</p></main>
<script>
(()=> {
const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id),W=960,H=540;
const scoreE=$('score'),bestE=$('best'),livesE=$('lives'),statusE=$('status');
let ship,shots=[],targets=[],particles=[],stars=[],score=0,lives=3,running=false,paused=false,gameOver=false,raf=0,last=0,spawn=0,fire=0;
const keys={left:false,right:false,fire:false,space:false};let best=0;
try{best=Number(localStorage.getItem('signalBest')||0)}catch(e){}bestE.textContent=best;
function initStars(){stars=Array.from({length:100},(_,i)=>({x:i*137%W,y:i*83%H,s:12+i%5*9,z:i%7===0?2:1}))}initStars();
function reset(){cancelAnimationFrame(raf);ship={x:W/2,y:H-62,speed:390};shots=[];targets=[];particles=[];score=0;lives=3;spawn=.35;fire=0;scoreE.textContent=0;livesE.textContent=3;gameOver=false;paused=false;running=true;statusE.textContent='LIVE';last=performance.now();raf=requestAnimationFrame(loop)}
function label(t,y,size=22,color='#e6f1f5'){ctx.fillStyle=color;ctx.font=`700 ${size}px ui-monospace,monospace`;ctx.textAlign='center';ctx.fillText(t,W/2,y)}
function background(dt){ctx.fillStyle='#080d13';ctx.fillRect(0,0,W,H);stars.forEach(s=>{s.y+=s.s*dt;if(s.y>H){s.y=0;s.x=(s.x+197)%W}ctx.fillStyle=s.z===2?'#52756f':'#263744';ctx.fillRect(s.x,s.y,s.z,s.z)});ctx.strokeStyle='rgba(65,105,115,.09)';for(let x=42;x<W;x+=34)for(let y=38;y<H;y+=34)ctx.strokeRect(x,y,24,24)}
function drawShip(){ctx.save();ctx.translate(ship.x,ship.y);ctx.fillStyle='#2563eb';ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(21,19);ctx.lineTo(0,10);ctx.lineTo(-21,19);ctx.closePath();ctx.fill();ctx.fillStyle='#bfdbfe';ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(9,13);ctx.lineTo(-9,13);ctx.closePath();ctx.fill();ctx.fillStyle='#fb923c';ctx.beginPath();ctx.moveTo(-6,16);ctx.lineTo(0,34+Math.random()*5);ctx.lineTo(6,16);ctx.fill();ctx.restore()}
function burst(x,y,color){for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*210,vy:(Math.random()-.5)*210,life:.48,color})}
function draw(dt){background(dt);targets.forEach(t=>{ctx.fillStyle='#22c55e';ctx.shadowColor='#22c55e';ctx.shadowBlur=12;ctx.beginPath();ctx.roundRect(t.x-t.r,t.y-t.r,t.r*2,t.r*2,5);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#0b281b';ctx.fillRect(t.x-3,t.y-3,6,6)});ctx.fillStyle='#fde047';ctx.shadowColor='#fde047';ctx.shadowBlur=12;shots.forEach(s=>ctx.fillRect(s.x-2,s.y-10,4,13));ctx.shadowBlur=0;particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)});ctx.globalAlpha=1;if(lives>0&&ship)drawShip();if(!running||paused){ctx.fillStyle='rgba(3,8,13,.7)';ctx.fillRect(0,0,W,H);label(paused?'PAUSED':gameOver?'SIGNAL LOST':'READY PLAYER ONE',H/2-10,34);label(gameOver?`FINAL SCORE ${score}`:'PRESS START TO ENTER THE ARCADE',H/2+30,16,'#8ea3b2')}}
function finish(){running=false;gameOver=true;statusE.textContent='GAME OVER';cancelAnimationFrame(raf);if(score>best){best=score;bestE.textContent=best;try{localStorage.setItem('signalBest',String(best))}catch(e){}}draw(0)}
function update(dt){if(keys.left)ship.x-=ship.speed*dt;if(keys.right)ship.x+=ship.speed*dt;ship.x=Math.max(25,Math.min(W-25,ship.x));fire-=dt;if((keys.fire||keys.space)&&fire<=0){shots.push({x:ship.x,y:ship.y-24});fire=.22}spawn-=dt;if(spawn<=0){let r=13+Math.random()*7;targets.push({x:35+Math.random()*(W-70),y:-r,r,speed:80+Math.min(score*.7,170)});spawn=Math.max(.32,1.05-score*.003)}shots.forEach(s=>s.y-=560*dt);targets.forEach(t=>t.y+=t.speed*dt);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});for(let i=targets.length-1;i>=0;i--){let t=targets[i],hit=false;for(let j=shots.length-1;j>=0;j--){if(Math.hypot(t.x-shots[j].x,t.y-shots[j].y)<t.r+8){shots.splice(j,1);hit=true;break}}if(hit){burst(t.x,t.y,'#4ade80');targets.splice(i,1);score+=10;scoreE.textContent=score;continue}if(Math.hypot(t.x-ship.x,t.y-ship.y)<t.r+17||t.y>H+15){burst(t.x,t.y,'#fb7185');targets.splice(i,1);lives--;livesE.textContent=lives;if(lives<=0){finish();return}}}shots=shots.filter(s=>s.y>-20);particles=particles.filter(p=>p.life>0)}
function loop(now){if(!running||paused)return;let dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw(dt);if(running&&!paused)raf=requestAnimationFrame(loop)}
function pause(){if(!running)return;paused=!paused;statusE.textContent=paused?'PAUSED':'LIVE';cancelAnimationFrame(raf);if(!paused){last=performance.now();raf=requestAnimationFrame(loop)}else draw(0)}
function hold(id,key){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false))}
hold('left','left');hold('right','right');hold('shoot','fire');$('start').addEventListener('click',reset);$('pause').addEventListener('click',pause);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.code==='Space')keys.space=true;if(e.key.toLowerCase()==='p')pause();if(e.key==='Enter'&&!running)reset()});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;if(e.code==='Space')keys.space=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause()});
draw(0);
})();
</script></body></html>
