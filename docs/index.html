<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>Playable Signal — Samarjeet Patil</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--line:#263744;--text:#e6f1f5;--muted:#8ea3b2;--green:#34d399}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#183244 0,#0b1018 55%);font-family:ui-monospace,Consolas,monospace;color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}main{width:min(900px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}h1{font:700 clamp(22px,4vw,34px) system-ui;margin:0}header p{margin:5px 0 0;color:var(--muted);font-size:13px}.pill{border:1px solid #276448;color:#73efb7;padding:7px 11px;border-radius:999px;font-size:11px;letter-spacing:.12em}.screen{background:#080d13;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 18px 65px #0008}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#080d13;border-radius:10px;touch-action:none}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 8px 4px;font-size:13px;color:var(--muted)}.hud strong{color:var(--green)}.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}button{background:#172632;color:var(--text);border:1px solid #355061;border-radius:10px;padding:12px 17px;font:600 13px ui-monospace,monospace;cursor:pointer;min-height:44px}button.primary{background:#166a47;border-color:#269b68;color:#effff7}button:focus-visible{outline:3px solid #60a5fa;outline-offset:3px}.pad{display:flex;gap:8px}.help{color:var(--muted);font-size:12px;line-height:1.7;margin:13px 3px 0}@media(max-width:520px){body{padding:12px}.controls{justify-content:center}.pad{width:100%;justify-content:center}.controls>button{flex:1}}
</style></head><body><main>
<header><div><h1>🕹️ Playable Signal</h1><p>CONTRIBUTION ARCADE / PILOT: SAMARJEET</p></div><span class="pill">● SYSTEM ONLINE</span></header>
<section class="screen" aria-label="Arcade game"><canvas id="game" width="960" height="540" aria-label="Space shooter game area"></canvas><div class="hud"><span>SCORE: <strong id="score">0</strong></span><span>BEST: <strong id="best">0</strong></span><span>SHIELDS: <strong id="lives">3</strong></span><span id="status" aria-live="polite">READY</span></div></section>
<div class="controls"><button class="primary" id="start">▶ START / RESTART</button><div class="pad"><button id="left">◀ LEFT</button><button id="shoot">✦ FIRE</button><button id="right">RIGHT ▶</button></div><button id="pause">Ⅱ PAUSE</button></div>
<p class="help">KEYBOARD: ← / → or A / D to move · SPACE to fire · P to pause. On touch screens, use the buttons. Dodge the falling signal blocks and shoot to clear the wave.</p></main>
<script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id);const scoreE=$('score'),bestE=$('best'),livesE=$('lives'),status=$('status');const W=960,H=540;let ship,shots,targets,particles,score=0,lives=3,running=false,paused=false,over=false,keys={},last=0,spawn=0,fire=0,best=0;try{best=+(localStorage.getItem('signalBest')||0)}catch(e){}bestE.textContent=best;
function reset(){ship={x:W/2,y:H-62,speed:390};shots=[];targets=[];particles=[];score=0;lives=3;spawn=0;fire=0;scoreE.textContent=0;livesE.textContent=3;over=false;paused=false;running=true;status.textContent='LIVE';last=performance.now();requestAnimationFrame(loop)}
function label(t,y,size=22,color='#e6f1f5'){x.fillStyle=color;x.font=`700 ${size}px ui-monospace,monospace`;x.textAlign='center';x.fillText(t,W/2,y)}
function bg(){x.fillStyle='#080d13';x.fillRect(0,0,W,H);for(let i=0;i<90;i++){let px=(i*137)%W,py=(i*83+(performance.now()*.012*(i%3+1)))%H;x.fillStyle=i%6===0?'#4a816e':'#263744';x.fillRect(px,py,i%6===0?2:1,i%6===0?2:1)}x.strokeStyle='rgba(65,105,115,.10)';for(let px=42;px<W;px+=34)for(let py=38;py<H;py+=34)x.strokeRect(px,py,24,24)}
function drawShip(){x.save();x.translate(ship.x,ship.y);x.fillStyle='#2563eb';x.beginPath();x.moveTo(0,-25);x.lineTo(21,19);x.lineTo(0,10);x.lineTo(-21,19);x.closePath();x.fill();x.fillStyle='#93c5fd';x.beginPath();x.moveTo(0,-17);x.lineTo(9,13);x.lineTo(-9,13);x.closePath();x.fill();x.fillStyle='#fb923c';x.beginPath();x.moveTo(-6,16);x.lineTo(0,34+Math.random()*6);x.lineTo(6,16);x.fill();x.restore()}
function burst(px,py,color){for(let i=0;i<9;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*190,vy:(Math.random()-.5)*190,life:.45,color})}
function draw(){bg();targets.forEach(t=>{x.fillStyle='#22c55e';x.shadowColor='#22c55e';x.shadowBlur=12;x.beginPath();x.roundRect(t.x-t.r,t.y-t.r,t.r*2,t.r*2,5);x.fill();x.shadowBlur=0;x.fillStyle='#0b281b';x.fillRect(t.x-3,t.y-3,6,6)});x.fillStyle='#fde047';x.shadowColor='#fde047';x.shadowBlur=12;shots.forEach(s=>x.fillRect(s.x-2,s.y-10,4,13));x.shadowBlur=0;particles.forEach(p=>{x.globalAlpha=Math.max(0,p.life*2);x.fillStyle=p.color;x.fillRect(p.x,p.y,4,4)});x.globalAlpha=1;if(lives>0)drawShip();if(!running||paused){x.fillStyle='rgba(3,8,13,.68)';x.fillRect(0,0,W,H);label(paused?'PAUSED':over?'SIGNAL LOST':'READY PLAYER ONE',H/2-10,34);label(over?`FINAL SCORE  ${score}`:'PRESS START TO ENTER THE ARCADE',H/2+30,16,'#8ea3b2')}}
function end(){running=false;over=true;status.textContent='GAME OVER';if(score>best){best=score;bestE.textContent=best;try{localStorage.setItem('signalBest',String(best))}catch(e){}}}
function update(dt){if(keys.left)ship.x-=ship.speed*dt;if(keys.right)ship.x+=ship.speed*dt;ship.x=Math.max(25,Math.min(W-25,ship.x));fire-=dt;if((keys.fire||keys.space)&&fire<=0){shots.push({x:ship.x,y:ship.y-24});fire=.22}spawn-=dt;if(spawn<=0){let r=13+Math.random()*7;targets.push({x:35+Math.random()*(W-70),y:-r,r,speed:75+Math.min(score*.7,150)});spawn=Math.max(.32,1.05-score*.003)}shots.forEach(s=>s.y-=560*dt);targets.forEach(t=>t.y+=t.speed*dt);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});for(let i=targets.length-1;i>=0;i--){let t=targets[i],hit=false;for(let j=shots.length-1;j>=0;j--){if(Math.hypot(t.x-shots[j].x,t.y-shots[j].y)<t.r+8){shots.splice(j,1);hit=true;break}}if(hit){burst(t.x,t.y,'#4ade80');targets.splice(i,1);score+=10;scoreE.textContent=score;continue}if(Math.hypot(t.x-ship.x,t.y-ship.y)<t.r+17||t.y>H+15){burst(t.x,t.y,'#fb7185');targets.splice(i,1);lives--;livesE.textContent=lives;if(lives<=0){end();break}}}shots=shots.filter(s=>s.y>-20);particles=particles.filter(p=>p.life>0)}
function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.033);last=now;if(!paused)update(dt);draw();requestAnimationFrame(loop)}function pause(){if(!running)return;paused=!paused;status.textContent=paused?'PAUSED':'LIVE';if(!paused){last=performance.now();requestAnimationFrame(loop)}else draw()}
$('start').addEventListener('click',reset);$('pause').addEventListener('click',pause);function hold(id,k){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}hold('left','left');hold('right','right');hold('shoot','fire');window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.code==='Space')keys.space=true;if(e.key.toLowerCase()==='p')pause();if(e.key==='Enter'&&!running)reset()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;if(e.code==='Space')keys.space=false});draw()})();
</script></body></html>
